name: Production Direct Deployment

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Context
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project to Vercel Network
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-backend:
    name: Deploy Backend to Azure VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure CLI Login
        run: |
          az login \
            --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Deploy Backend to HX VM
        run: |
          set -euo pipefail

          REDIS_HOST=$(az webapp config appsettings list \
            --resource-group container-orca-rg \
            --name container-orca-api-20260422 \
            --query "[?name=='REDIS_HOST'].value | [0]" \
            -o tsv)
          REDIS_PORT=$(az webapp config appsettings list \
            --resource-group container-orca-rg \
            --name container-orca-api-20260422 \
            --query "[?name=='REDIS_PORT'].value | [0]" \
            -o tsv)
          REDIS_KEY=$(az webapp config appsettings list \
            --resource-group container-orca-rg \
            --name container-orca-api-20260422 \
            --query "[?name=='REDIS_PASSWORD'].value | [0]" \
            -o tsv)

          if [ -z "$REDIS_HOST" ] || [ -z "$REDIS_PORT" ] || [ -z "$REDIS_KEY" ]; then
            echo "Redis app settings are missing from container-orca-api-20260422."
            exit 1
          fi

          echo "::add-mask::$REDIS_KEY"
          REDIS_KEY_HEX=$(REDIS_KEY="$REDIS_KEY" python3 -c 'import os; print(os.environ["REDIS_KEY"].encode().hex())')

          az vm run-command invoke \
            --resource-group HX \
            --name hx-proxy-india \
            --command-id RunShellScript \
            --scripts @.github/scripts/deploy_hx_backend.sh \
            --parameters "$REDIS_HOST" "$REDIS_PORT" "$REDIS_KEY_HEX" "$GITHUB_SHA" \
            --output json
